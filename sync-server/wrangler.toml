name = "ngnl-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "ngnl-sync"
# Filled in by `wrangler d1 create ngnl-sync`.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Pages allowed to call the relay (comma-separated).
ALLOWED_ORIGINS = "https://wayne62314.github.io,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173"
